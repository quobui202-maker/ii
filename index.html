<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>E01SEC Telemetry</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050505; --panel: rgba(15, 15, 20, 0.6); --accent: #00f0ff;
    --accent-glow: rgba(0, 240, 255, 0.3); --success: #10b981; --text: #e2e8f0;
  }
  body {
    font-family: 'Inter', sans-serif; background-color: var(--bg);
    background-image: radial-gradient(circle at 15% 50%, rgba(0, 240, 255, 0.08), transparent 25%),
                      radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.05), transparent 25%);
    color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .grid-bg {
    position: absolute; inset: 0; z-index: -1; background-size: 40px 40px;
    background-image: linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                      linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
    mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
  }
  .panel {
    background: var(--panel); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
    width: 100%; max-width: 400px; position: relative; overflow: hidden;
  }
  .panel::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0.8;
  }
  .btn-neon {
    background: rgba(0, 240, 255, 0.1); border: 1px solid var(--accent); color: var(--accent);
    text-shadow: 0 0 10px var(--accent-glow); box-shadow: 0 0 15px var(--accent-glow), inset 0 0 10px transparent;
    transition: all 0.3s ease; text-decoration: none; display: block; width: 100%; text-align: center;
  }
  .btn-neon:active { background: rgba(0, 240, 255, 0.2); box-shadow: 0 0 25px var(--accent-glow), inset 0 0 15px var(--accent-glow); transform: scale(0.98); }
  .data-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-family: 'JetBrains Mono', monospace; }
  .data-row:last-child { border-bottom: none; }
  .data-label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }
  .data-value { font-size: 13px; color: var(--accent); font-weight: 700; word-break: break-all; text-align: right; max-width: 60%; }
  .hidden { display: none !important; }
  .blink { animation: blinker 2s linear infinite; }
  @keyframes blinker { 50% { opacity: 0.3; } }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="panel p-8" id="main-panel">
  
  <div id="step-install" class="text-center">
    <div class="w-24 h-24 mx-auto mb-6 rounded-full bg-[#00f0ff]/10 flex items-center justify-center relative">
      <div class="absolute inset-0 rounded-full border border-[#00f0ff]/30 animate-ping"></div>
      <svg class="w-10 h-10 text-[#00f0ff]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
    </div>
    <h1 class="text-2xl font-bold mb-2 tracking-wide text-white">DEVICE TELEMETRY</h1>
    <p class="text-xs text-slate-400 mb-8 leading-relaxed">Hệ thống trích xuất thông tin phần cứng iOS.<br>Yêu cầu sử dụng trình duyệt Safari.</p>
    
    <!-- Nút bấm gọi hàm Javascript tải file -->
    <button onclick="downloadProfile()" class="btn-neon py-4 rounded-xl font-bold text-sm tracking-widest">
      [ KHỞI TẠO KẾT NỐI ]
    </button>
    
    <p class="text-[10px] text-slate-500 mt-6">*Bấm "Cho phép" khi hệ thống yêu cầu.</p>
  </div>

  <div id="step-result" class="hidden">
    <div class="text-center mb-6">
      <div class="w-16 h-16 bg-[#10b981]/10 rounded-full flex items-center justify-center mx-auto mb-4 border border-[#10b981]/30 shadow-[0_0_20px_rgba(16,185,129,0.2)]">
        <svg class="w-8 h-8 text-[#10b981]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
      </div>
      <h2 class="text-xl font-bold text-white tracking-wide">TRUY XUẤT THÀNH CÔNG</h2>
      <div class="text-[10px] text-[#10b981] font-mono mt-1 blink">SECURE CONNECTION ESTABLISHED</div>
    </div>
    <div class="bg-black/40 rounded-xl p-5 border border-slate-800 mb-6">
      <div class="data-row"><span class="data-label">UDID</span> <span class="data-value" id="val-udid">...</span></div>
      <div class="data-row"><span class="data-label">Model</span> <span class="data-value" id="val-product">...</span></div>
      <div class="data-row"><span class="data-label">Firmware</span> <span class="data-value" id="val-version">...</span></div>
      <div class="data-row"><span class="data-label">Serial</span> <span class="data-value" id="val-serial">...</span></div>
      <div class="data-row"><span class="data-label">IMEI</span> <span class="data-value" id="val-imei">...</span></div>
    </div>
    <button onclick="copyData()" class="btn-neon py-3 rounded-xl font-bold text-xs tracking-widest">
      [ COPY TOÀN BỘ DỮ LIỆU ]
    </button>
  </div>

</div>

<script>
  // Lấy link gốc, nếu là localhost thì tự động sửa thành link github (để test)
  // YÊU CẦU: He phải chạy trên Github Pages thì mới lấy được
  const currentUrl = window.location.origin + window.location.pathname;

  // Hàm tạo file Mobileconfig và ép tải xuống
  function downloadProfile() {
    // Nếu đang chạy localhost, cảnh báo luôn
    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
      alert("LỖI: Bạn phải đưa code lên GitHub Pages (hoặc tên miền HTTPS thật). Giao thức cấu hình của Apple không hoạt động trên localhost.");
      return;
    }

    const xmlProfile = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>PayloadContent</key>
    <dict>
        <key>URL</key>
        <string>${currentUrl}?udid=@UDID@&amp;PRODUCT=@PRODUCT@&amp;VERSION=@VERSION@&amp;SERIAL=@SERIAL@&amp;IMEI=@IMEI@</string>
        <key>DeviceAttributes</key>
        <array>
            <string>UDID</string>
            <string>IMEI</string>
            <string>VERSION</string>
            <string>PRODUCT</string>
            <string>SERIAL</string>
        </array>
        <key>PayloadType</key>
        <string>Profile Service</string>
        <string>PayloadIdentifier</string>
        <key>PayloadIdentifier</key>
        <string>com.e01sec.telemetry</string>
        <key>PayloadUUID</key>
        <string>E01SEC-1234-5678-90AB-UDID0000001</string>
        <key>PayloadVersion</key>
        <integer>1</integer>
    </dict>
    <key>PayloadDisplayName</key>
    <string>E01SEC Telemetry</string>
    <key>PayloadIdentifier</key>
    <string>com.e01sec.profile</string>
    <key>PayloadOrganization</key>
    <string>E01SEC Workshop</string>
    <key>PayloadType</key>
    <string>Configuration</string>
    <key>PayloadUUID</key>
    <string>E01SEC-1234-5678-90AB-UDID0000000</string>
    <key>PayloadVersion</key>
    <integer>1</integer>
</dict>
</plist>`;

    // Tạo Blob với MIME type chuẩn của Apple
    const blob = new Blob([xmlProfile], { type: 'application/x-apple-aspen-config' });
    const url = URL.createObjectURL(blob);
    
    // Tạo thẻ a ẩn để ép trình duyệt tải file
    const a = document.createElement('a');
    a.href = url;
    a.download = 'telemetry.mobileconfig'; // Đuôi file bắt buộc
    document.body.appendChild(a);
    
    // Click và dọn dẹp
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 100);
  }

  // Kiểm tra dữ liệu trả về từ URL
  function checkTelemetry() {
    const params = new URLSearchParams(window.location.search);
    const udid = params.get('udid') || params.get('UDID');
    
    if (udid) {
      document.getElementById('step-install').classList.add('hidden');
      document.getElementById('step-result').classList.remove('hidden');
      document.getElementById('val-udid').innerText = udid;
      document.getElementById('val-product').innerText = params.get('PRODUCT') || 'N/A';
      document.getElementById('val-version').innerText = params.get('VERSION') || 'N/A';
      document.getElementById('val-serial').innerText = params.get('SERIAL') || 'N/A';
      document.getElementById('val-imei').innerText = params.get('IMEI') || 'N/A';
    }
  }

  window.onload = checkTelemetry;

  function copyData() {
    const text = `[E01SEC TELEMETRY]\nUDID: ${document.getElementById('val-udid').innerText}\nModel: ${document.getElementById('val-product').innerText}\niOS: ${document.getElementById('val-version').innerText}\nSerial: ${document.getElementById('val-serial').innerText}\nIMEI: ${document.getElementById('val-imei').innerText}`;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.querySelector('button[onclick="copyData()"]');
      btn.innerText = '[ ĐÃ COPY ]';
      setTimeout(() => btn.innerText = '[ COPY TOÀN BỘ DỮ LIỆU ]', 2000);
    });
  }
</script>
</body>
</html>
